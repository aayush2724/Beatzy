[lint]
# Pin the rule set explicitly. Without this, `select` follows whatever the
# installed ruff version happens to default to — ruff 0.16 widened its defaults
# from ~4 rule groups to ~30, which turned CI red with 67 findings without a
# single line of code changing. These are ruff's classic defaults, which this
# codebase already satisfies.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# load_dotenv() must run before imports that read os.environ
"app/main.py" = ["E402"]
